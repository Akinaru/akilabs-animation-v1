<!doctype html>
<!-- Aki Labs studio ident v3 (owner 2026-11-10: the 7-cut animation is too chaotic, cancel it; cleaner premium
     proposals; no small line defects; AKI LABS bigger; no STUDIOS). The mark is always animated WHOLE (no pieces,
     no clips, no seams). 4 proposals, each: mark, then AKI LABS, a 2 px loading line, outro.
       A Lumière   a soft diagonal light wipe reveals the mark
       B Tracé     the mark's outline draws itself, then fills
       C Mise au point   the mark comes from out of focus and slightly too big, settles sharp
       D Iris      a clean circle opens from the centre of the mark
     http://127.0.0.1:3661/aki-labs-brand/loader/ident-final.html -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro Aki Labs</title>
<style>
  @font-face { font-family: 'Aki Archivo Black'; src: url('../fonts/ArchivoBlack-Regular.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 5; font: 600 13px system-ui; }
  #ui button { background: rgba(255,255,255,.06); color: #ccc; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
  #ui button.on { background: #f4f4f6; color: #08080a; }
  #ui b { color: #777; margin: 0 2px 0 8px; align-self: center; font-size: 11px; letter-spacing: .1em; }
  #ui.hide { opacity: 0; transition: opacity .4s; } #ui:hover { opacity: 1; }

  .splash { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse 60% 55% at 50% 46%, #121215 0%, #08080a 60%, #050506 100%); }
  .ident { display: flex; flex-direction: column; align-items: center; }
  .leaving .ident { animation: out calc(.75s * var(--k)) cubic-bezier(.55,0,.8,.2) forwards; }
  @keyframes out { to { opacity: 0; transform: scale(1.06); filter: blur(10px); } }
  .mark { --h: min(25vh, 30vw, 220px); height: var(--h); width: calc(var(--h) * 0.8344); overflow: visible; display: block; }

  /* the wordmark: one block, letters condense from wide tracking, centre first */
  .word { margin-top: min(5vh, 40px); display: flex; font: 400 min(11vh, 13vw, 112px)/.9 'Aki Archivo Black', system-ui, sans-serif; color: #f4f4f6; }
  .word span { display: inline-block; opacity: 0; animation: letter calc(.9s * var(--k)) cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes letter { from { opacity: 0; filter: blur(10px); transform: translateX(var(--dx)); } to { opacity: 1; filter: blur(0); transform: none; } }
  .word .sp { width: .26em; }
  .bar { position: relative; margin-top: min(4.4vh, 36px); width: min(34vw, 30vh, 260px); height: 2px; border-radius: 2px; background: rgb(255 255 255 / .12); opacity: 0; animation: fade calc(.6s * var(--k)) ease-out var(--bar) forwards; overflow: hidden; }
  .fill { position: absolute; inset: 0; background: #f4f4f6; transform-origin: 0 50%; transform: scaleX(0); }
  @keyframes fade { to { opacity: 1; } }

  /* A: light wipe (mask gradient slides across the whole mark) */
  .wipe { transform: translateX(-3400px); animation: wipe calc(1.25s * var(--k)) cubic-bezier(.65,0,.35,1) calc(.25s * var(--k)) forwards; }
  @keyframes wipe { to { transform: translateX(2700px); } }
  /* B: outline draws, then the fill comes in */
  .line { fill: none; stroke: #f4f4f6; stroke-width: 380; stroke-linejoin: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; animation: draw calc(1.4s * var(--k)) cubic-bezier(.45,0,.25,1) calc(.2s * var(--k)) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fillin { opacity: 0; animation: fade calc(.6s * var(--k)) ease-out calc(1.35s * var(--k)) forwards; }
  /* C: rack focus */
  .mark.focus { opacity: 0; transform-origin: 50% 50%; animation: focus calc(1.3s * var(--k)) cubic-bezier(.2,.8,.2,1) calc(.2s * var(--k)) forwards; }
  @keyframes focus { from { opacity: 0; transform: scale(1.18); filter: blur(28px); } 40% { opacity: 1; } to { opacity: 1; transform: scale(1); filter: blur(0); } }
  /* D: iris */
  .iris { r: 0; animation: iris calc(1.1s * var(--k)) cubic-bezier(.65,0,.35,1) calc(.25s * var(--k)) forwards; }
  @keyframes iris { to { r: 1900px; } }
  /* light sweep over the finished mark (A, C, D) */
  .sheen { transform: translateX(-1600px); animation: sheen calc(1s * var(--k)) cubic-bezier(.55,0,.35,1) var(--sheen) forwards; }
  @keyframes sheen { to { transform: translateX(2800px); } }
</style>
</head>
<body style="--k:1">
<div id="ui">
  <b>ANIMATION</b>
  <button data-v="A" class="on">A. Lumière</button>
  <button data-v="B">B. Tracé</button>
  <button data-v="C">C. Mise au point</button>
  <button data-v="D">D. Iris</button>
  <b>LECTURE</b>
  <button id="replay">Rejouer</button>
  <button data-k="1" class="on">Normale</button>
  <button data-k="3">Ralenti x3</button>
  <button id="loop" class="on">En boucle</button>
</div>
<div id="stage"></div>
<script type="module">
const svg = await (await fetch('../logo-mark/final/aki-mark.svg')).text();
const shape = svg.slice(svg.indexOf('<g'), svg.lastIndexOf('</g>') + 4);
await document.fonts.load("112px 'Aki Archivo Black'");
const VB = 'viewBox="0 0 2268 2718"';
const MASK_REGION = 'maskUnits="userSpaceOnUse" x="-8000" y="-8000" width="18000" height="19000"';
const sheen = `<linearGradient id="g-sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="m-shape" ${MASK_REGION}><g fill="#fff">${shape}</g></mask>`;
const sheenLayer = `<g mask="url(#m-shape)"><rect class="sheen" x="-300" y="-600" width="800" height="3900" fill="url(#g-sheen)" transform="rotate(20 1134 1359)"/></g>`;
const MARKS = {
  A: {mark: `<defs><linearGradient id="g-wipe" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="m-wipe" ${MASK_REGION}><rect class="wipe" x="-6000" y="-1500" width="6600" height="5700" fill="url(#g-wipe)" transform="rotate(20 1134 1359)"/></mask>${sheen}</defs>
      <g mask="url(#m-wipe)">${shape}</g>${sheenLayer}`, word: 1.15, bar: 1.9, sheen: 1.6},
  B: {mark: `<g class="fillin">${shape}</g><g class="line">${shape.replace('stroke="none"', '').replace('<path ', '<path pathLength="100" ')}</g>`, word: 1.35, bar: 2.0, sheen: 0},
  C: {cls: 'focus', mark: `<defs>${sheen}</defs><g>${shape}</g>${sheenLayer}`, word: 0.95, bar: 1.75, sheen: 1.45},
  D: {mark: `<defs><mask id="m-iris" ${MASK_REGION}><circle class="iris" cx="1180" cy="1700" r="0" fill="#fff"/></mask>${sheen}</defs>
      <g mask="url(#m-iris)">${shape}</g>${sheenLayer}`, word: 1.0, bar: 1.8, sheen: 1.5},
};
let v = 'A', k = 1, loop = true, timers = [];
function play() {
  timers.forEach(clearTimeout); timers = [];
  document.body.style.setProperty('--k', k);
  const M = MARKS[v];
  const word = [...'AKI LABS'], mid = (word.length - 1) / 2;
  const letters = word.map((c, i) => c === ' ' ? '<span class="sp"></span>' : `<span style="--dx:${((i - mid) * 0.16).toFixed(2)}em;animation-delay:${((M.word + Math.abs(i - mid) * 0.06) * 1000 * k).toFixed(0)}ms">${c}</span>`).join('');
  const st = document.getElementById('stage');
  st.style.setProperty('--bar', `${M.bar * k}s`);
  st.style.setProperty('--sheen', M.sheen ? `${M.sheen * k}s` : '999s');
  st.innerHTML = `<div class="splash"><div class="ident"><svg class="mark ${M.cls || ''}" ${VB} fill="#f4f4f6">${M.mark}</svg><div class="word">${letters}</div><div class="bar"><div class="fill"></div></div></div></div>`;
  document.querySelector('.fill').animate([{transform: 'scaleX(0)'}, {transform: 'scaleX(1)'}], {duration: 1200 * k, delay: (M.bar + 0.3) * 1000 * k, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards'});
  timers.push(setTimeout(() => document.querySelector('.splash').classList.add('leaving'), (M.bar + 1.9) * 1000 * k));
  if (loop) timers.push(setTimeout(play, (M.bar + 3.0) * 1000 * k));
}
const sel = (q, b) => document.querySelectorAll(q).forEach((x) => x.classList.toggle('on', x === b));
document.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => { v = b.dataset.v; sel('[data-v]', b); play(); }));
document.getElementById('replay').onclick = play;
document.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { k = +b.dataset.k; sel('[data-k]', b); play(); }));
document.getElementById('loop').onclick = (e) => { loop = !loop; e.target.classList.toggle('on', loop); play(); };
window.labSet = (x) => { v = x; sel('[data-v]', document.querySelector(`[data-v="${x}"]`)); play(); };
setTimeout(() => document.getElementById('ui').classList.add('hide'), 2500);
play();
</script>
</body>
</html>
