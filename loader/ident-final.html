<!doctype html>
<!-- Aki Labs studio ident (owner 2026-11-10: a real, clean studio animation for the loading). The mark is cut at the
     pixel into 3 pieces (logo-mark/final/pieces, cuts H2 top / B4 bottom): the 7, the fang, the rest.
       0.20 s  the 7 is traced by light (soft front along its own stroke)
       1.25 s  the fang and the flask's right side flow out of the 7 (soft fronts)
       1.55 s  the bowl fills like a liquid rising, with a wave
       2.25 s  the whole mark takes over, a light sweep crosses it, a soft glow breathes
       2.30 s  AKI LABS condenses from wide tracking and blur, centre first; STUDIOS; the hairline draws from the centre
       slow camera push over the whole ident; outro = push through + blur + fade.
     Same file is the reference for grumpy-mole StudioSplash.svelte.
     http://127.0.0.1:3661/aki-labs-brand/loader/ident-final.html -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro Aki Labs</title>
<style>
  @font-face { font-family: 'Aki Archivo Black'; src: url('../fonts/ArchivoBlack-Regular.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #040405; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; z-index: 5; font: 600 13px system-ui; }
  #ui button { background: rgba(255,255,255,.06); color: #ccc; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
  #ui button.on { background: #f4f4f6; color: #08080a; }
  #ui.hide { opacity: 0; transition: opacity .4s; } #ui:hover { opacity: 1; }

  .splash { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse 65% 55% at 50% 45%, #141418 0%, #09090b 55%, #040405 100%); }
  .splash::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 40% 34% at 50% 40%, rgb(255 255 255 / .05), transparent 70%); opacity: 0; animation: fadein calc(1.6s * var(--k)) ease-out calc(.4s * var(--k)) forwards; }
  .ident { display: flex; flex-direction: column; align-items: center; transform: scale(.965); animation: push calc(4.2s * var(--k)) cubic-bezier(.25,.1,.25,1) forwards; }
  @keyframes push { to { transform: scale(1); } }
  .leaving .ident { animation: through calc(.8s * var(--k)) cubic-bezier(.5,0,.75,0) forwards; }
  @keyframes through { from { transform: scale(1); opacity: 1; filter: blur(0); } to { transform: scale(1.08); opacity: 0; filter: blur(14px); } }
  @keyframes fadein { to { opacity: 1; } }

  .mark { height: min(27vh, 32vw, 240px); width: auto; overflow: visible; }
  .soft { filter: url(#aki-soft); }
  .trace { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; animation: trace forwards; }
  @keyframes trace { to { stroke-dashoffset: 0; } }
  .t7 { stroke-width: 820; animation-duration: calc(1.05s * var(--k)); animation-delay: calc(.2s * var(--k)); animation-timing-function: cubic-bezier(.45,0,.2,1); }
  .tf { stroke-width: 720; animation-duration: calc(.6s * var(--k)); animation-delay: calc(1.25s * var(--k)); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  .ts { stroke-width: 460; animation-duration: calc(.55s * var(--k)); animation-delay: calc(1.3s * var(--k)); animation-timing-function: cubic-bezier(.4,0,.6,1); }
  .liquid { transform: translateY(1000px); animation: rise calc(.75s * var(--k)) cubic-bezier(.3,0,.2,1) calc(1.55s * var(--k)) forwards; }
  @keyframes rise { to { transform: translateY(0); } }
  .wave { animation: wave calc(.75s * var(--k)) linear calc(1.55s * var(--k)) forwards; }
  @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-600px); } }
  .pieces { animation: hide 1ms linear calc(2.3s * var(--k)) forwards; }
  .whole { opacity: 0; animation: show 1ms linear calc(2.3s * var(--k)) forwards; }
  @keyframes hide { to { opacity: 0; } } @keyframes show { to { opacity: 1; } }
  .glow { opacity: 0; animation: glow calc(1.8s * var(--k)) ease-in-out calc(2.2s * var(--k)) forwards; }
  @keyframes glow { 0% { opacity: 0; } 35% { opacity: .55; } 100% { opacity: .18; } }
  .sheen { transform: translateX(-1400px); animation: sheen calc(.9s * var(--k)) cubic-bezier(.55,0,.35,1) calc(2.3s * var(--k)) forwards; }
  @keyframes sheen { to { transform: translateX(2600px); } }

  .word { margin-top: min(4.6vh, 36px); display: flex; font: 400 min(8.6vh, 10.5vw, 80px)/.9 'Aki Archivo Black', system-ui, sans-serif; color: #f4f4f6; }
  .word span { display: inline-block; opacity: 0; filter: blur(12px); animation: letter calc(.95s * var(--k)) cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes letter { from { opacity: 0; filter: blur(12px); transform: translateX(var(--dx)); } to { opacity: 1; filter: blur(0); transform: none; } }
  .word .sp { width: .28em; }
  .sub { margin-top: 1em; padding-left: .9em; font: 700 min(1.9vh, 2.6vw, 15px) Inter, system-ui, sans-serif; letter-spacing: .9em; text-transform: uppercase; color: #8a8a93; opacity: 0; animation: track calc(1.4s * var(--k)) cubic-bezier(.2,.8,.2,1) calc(2.75s * var(--k)) forwards; }
  @keyframes track { from { opacity: 0; letter-spacing: .4em; } to { opacity: 1; letter-spacing: .9em; } }
  .bar { position: relative; margin-top: min(3.4vh, 26px); width: min(30vw, 28vh, 220px); height: 1px; background: rgb(255 255 255 / .12); transform: scaleX(0); animation: line calc(.9s * var(--k)) cubic-bezier(.65,0,.35,1) calc(2.95s * var(--k)) forwards; }
  @keyframes line { to { transform: scaleX(1); } }
  .fill { position: absolute; inset: 0; background: #f4f4f6; box-shadow: 0 0 10px rgb(255 255 255 / .55); transform-origin: 0 50%; transform: scaleX(0); }
</style>
</head>
<body style="--k:1">
<div id="ui">
  <button id="replay">Rejouer</button>
  <button data-k="1" class="on">Vitesse normale</button>
  <button data-k="3">Ralenti x3</button>
  <button id="loop" class="on">En boucle</button>
  <button id="out" class="on">Avec la sortie</button>
</div>
<div id="stage"></div>
<script type="module">
const svg = await (await fetch('../logo-mark/final/aki-mark.svg')).text();
const shape = svg.slice(svg.indexOf('<g'), svg.lastIndexOf('</g>') + 4);
const P = await (await fetch('../logo-mark/final/pieces/aki-mark-pieces.json')).json();
await document.fonts.load("80px 'Aki Archivo Black'");
const px = (pts) => 'M ' + pts.map(([x, y]) => `${x * 3} ${y * 3}`).join(' L ');
// guide paths along each piece's own stroke (px of the 756 x 906 render)
const T7 = px([[175, 150], [330, 112], [520, 100], [625, 55], [575, 175], [470, 300], [330, 395], [180, 490], [80, 600], [62, 720], [112, 832]]);
const TF = px([[262, 192], [272, 240], [262, 300], [236, 352], [212, 395]]);
const TS = px([[566, 300], [572, 420], [588, 560], [625, 640]]);
const clip = (id, n) => `<clipPath id="${id}"><path transform="${P[n].transform}" d="${P[n].d}"/></clipPath>`;
// liquid: a wide wavy body that rises into the bowl
let wave = 'M -1200 1880';
for (let x = -1200; x <= 3600; x += 1200) wave += ` Q ${x + 300} 1835 ${x + 600} 1880 T ${x + 1200} 1880`;
wave += ' L 3600 3200 L -1200 3200 Z';
const MARK = `<defs>
  <filter id="aki-soft" filterUnits="userSpaceOnUse" x="-600" y="-600" width="3500" height="3900"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="aki-surface" filterUnits="userSpaceOnUse" x="-600" y="-600" width="3500" height="3900"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="aki-glow" filterUnits="userSpaceOnUse" x="-600" y="-600" width="3500" height="3900"><feGaussianBlur stdDeviation="70"/></filter>
  <linearGradient id="aki-sheen" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  ${clip('c7', 'seven')}${clip('cf', 'fang')}${clip('cr', 'rest')}
  <mask id="m7" maskUnits="userSpaceOnUse" x="-500" y="-500" width="3300" height="3700"><path class="trace t7 soft" d="${T7}" pathLength="100"/></mask>
  <mask id="mf" maskUnits="userSpaceOnUse" x="-500" y="-500" width="3300" height="3700"><path class="trace tf soft" d="${TF}" pathLength="100"/></mask>
  <mask id="mr" maskUnits="userSpaceOnUse" x="-500" y="-500" width="3300" height="3700">
    <path class="trace ts soft" d="${TS}" pathLength="100"/>
    <g class="liquid"><path class="wave" d="${wave}" fill="#fff" filter="url(#aki-surface)"/></g>
  </mask>
  <mask id="mshape" maskUnits="userSpaceOnUse" x="0" y="0" width="2268" height="2718"><g fill="#fff">${shape}</g></mask>
</defs>
<g class="glow" filter="url(#aki-glow)" fill="#fff">${shape}</g>
<g class="pieces">
  <g clip-path="url(#c7)"><g mask="url(#m7)">${shape}</g></g>
  <g clip-path="url(#cf)"><g mask="url(#mf)">${shape}</g></g>
  <g clip-path="url(#cr)"><g mask="url(#mr)">${shape}</g></g>
</g>
<g class="whole">${shape}</g>
<g mask="url(#mshape)"><rect class="sheen" x="-200" y="-400" width="700" height="3600" fill="url(#aki-sheen)" transform="rotate(18 1134 1359)"/></g>`;

let k = 1, loop = true, withOut = true, timers = [];
function play() {
  timers.forEach(clearTimeout); timers = [];
  document.body.style.setProperty('--k', k);
  const word = [...'AKI LABS'];
  const mid = (word.length - 1) / 2;
  const letters = word.map((c, i) => {
    if (c === ' ') return '<span class="sp"></span>';
    const d = Math.abs(i - mid);
    return `<span style="--dx:${((i - mid) * 0.18).toFixed(2)}em;animation-delay:${((2.3 + d * 0.07) * 1000 * k).toFixed(0)}ms">${c}</span>`;
  }).join('');
  document.getElementById('stage').innerHTML = `<div class="splash"><div class="ident">
    <svg class="mark" viewBox="0 0 2268 2718" fill="#f4f4f6">${MARK}</svg>
    <div class="word">${letters}</div><div class="sub">Studios</div><div class="bar"><div class="fill"></div></div></div></div>`;
  // the hairline fills (stands for a quick loading), then the outro
  document.querySelector('.fill').animate([{transform: 'scaleX(0)'}, {transform: 'scaleX(1)'}], {duration: 1100 * k, delay: 3600 * k, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards'});
  if (withOut) timers.push(setTimeout(() => document.querySelector('.splash').classList.add('leaving'), 4900 * k));
  if (loop) timers.push(setTimeout(play, (withOut ? 6200 : 5600) * k));
}
const sel = (q, b) => document.querySelectorAll(q).forEach((x) => x.classList.toggle('on', x === b));
document.getElementById('replay').onclick = play;
document.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { k = +b.dataset.k; sel('[data-k]', b); play(); }));
document.getElementById('loop').onclick = (e) => { loop = !loop; e.target.classList.toggle('on', loop); play(); };
document.getElementById('out').onclick = (e) => { withOut = !withOut; e.target.classList.toggle('on', withOut); play(); };
setTimeout(() => document.getElementById('ui').classList.add('hide'), 2500);
play();
</script>
</body>
</html>
